<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kama₹ - Daily Task Karo, Direct UPI Mein Withdrawal</title>
    <meta name="description" content="Kama₹ earning website - Survey bharo, tasks complete karo aur seedha apne UPI account mein paise withdraw karo." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Fraunces', 'serif'],
              mono: ['IBM Plex Mono', 'monospace'],
            }
          }
        }
      }
    </script>

    <!-- React 18 CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Lucide Icons UMD -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-[#0A0E1B] text-[#F5F3EC] antialiased">
    <div id="root"></div>

    <script>
      // Proxy to dynamically map any LucideReact icon name (e.g. Wallet, ShieldCheck) to dynamic SVG renderer
      window.LucideIcons = new Proxy({}, {
        get(target, prop) {
          return function IconWrapper({ size = 18, color, className = "", style = {} }) {
            const ref = React.useRef(null);
            React.useEffect(() => {
              if (ref.current && window.lucide) {
                ref.current.innerHTML = '';
                const kebab = prop.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                const i = document.createElement('i');
                i.setAttribute('data-lucide', kebab);
                if (color) i.style.color = color;
                ref.current.appendChild(i);
                window.lucide.createIcons({
                  targets: [i],
                  attrs: { width: size, height: size, class: className }
                });
              }
            }, [size, color, className]);
            return React.createElement('span', { ref, className: 'inline-flex items-center justify-center', style });
          };
        }
      });
    </script>

    <!-- Pre-compiled Standalone React App (Zero Build Dependency, Bulletproof Execution) -->
    <script src="/app.js"></script>
  </body>
</html>
