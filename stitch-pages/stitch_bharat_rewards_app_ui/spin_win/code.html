<script>
        document.addEventListener('DOMContentLoaded', () => {
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spinBtn');
            let currentRotation = 0;
            let isSpinning = false;

            spinBtn.addEventListener('click', () => {
                if (isSpinning) return;
                isSpinning = true;
                
                // Add disabled visual state
                spinBtn.classList.add('opacity-75', 'cursor-not-allowed');
                spinBtn.querySelector('span').classList.add('animate-spin');

                // Calculate random rotation (min 5 spins + random segment)
                const baseSpins = 5 * 360;
                const randomDegree = Math.floor(Math.random() * 360);
                currentRotation += baseSpins + randomDegree;

                // Apply rotation
                wheel.style.transform = `rotate(${currentRotation}deg)`;

                // Reset after spin
                setTimeout(() => {
                    isSpinning = false;
                    spinBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                    spinBtn.querySelector('span').classList.remove('animate-spin');
                    
                    // Trigger confetti or alert here in a real app
                    // alert('Congratulations! You won!'); 
                }, 4000); // Matches transition duration
            });
        });
